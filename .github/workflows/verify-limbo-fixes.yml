name: Verify limbo fixes

on:
  push:
    branches:
      - fix/limbo-auth-modern
    paths:
      - .github/workflows/verify-limbo-fixes.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/limbo-auth-modern

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build Admin Frontend
        uses: ./.github/actions/build-frontend

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check touched crates
        run: cargo check -p infrarust-core -p infrarust-plugin-auth

      - name: Test touched crates
        run: cargo test -p infrarust-core -p infrarust-plugin-auth

      - name: Build patched Infrarust
        run: cargo build --release -p infrarust

      - name: Package test binary
        run: |
          cp target/release/infrarust target/release/infrarust-limbo-patch-linux-x86_64

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: infrarust-limbo-patch-linux-x86_64
          path: target/release/infrarust-limbo-patch-linux-x86_64
          if-no-files-found: error
