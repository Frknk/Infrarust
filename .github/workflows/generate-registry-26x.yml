name: Generate 26.x registry snapshots

on:
  push:
    branches:
      - fix/limbo-auth-modern
    paths:
      - .github/workflows/generate-registry-26x.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build registry extractor
        run: cargo build --release -p registry-extractor

      - name: Extract Minecraft 26.1 and 26.2 registry data
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f infrarust-registry-extractor >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          extract_version() {
            local mc_version="$1"
            local protocol="$2"

            cleanup
            echo "Starting vanilla Minecraft ${mc_version} (protocol ${protocol})"
            docker run -d \
              --name infrarust-registry-extractor \
              -p 25599:25565 \
              -e EULA=TRUE \
              -e VERSION="${mc_version}" \
              -e TYPE=VANILLA \
              -e ONLINE_MODE=false \
              -e MEMORY=1G \
              -e SPAWN_PROTECTION=0 \
              -e VIEW_DISTANCE=4 \
              -e MAX_TICK_TIME=-1 \
              itzg/minecraft-server:java25 >/dev/null

            ready=false
            for _ in $(seq 1 60); do
              if docker exec infrarust-registry-extractor mc-health >/dev/null 2>&1; then
                ready=true
                break
              fi
              if ! docker ps --format '{{.Names}}' | grep -qx infrarust-registry-extractor; then
                echo "Minecraft ${mc_version} container stopped unexpectedly"
                docker logs infrarust-registry-extractor || true
                exit 1
              fi
              sleep 5
            done

            if [ "$ready" != true ]; then
              echo "Minecraft ${mc_version} did not become ready"
              docker logs --tail 100 infrarust-registry-extractor || true
              exit 1
            fi

            ./target/release/registry-extractor \
              --server 127.0.0.1:25599 \
              --protocol-version "${protocol}" \
              --output data/registry

            test -s "data/registry/v${protocol}.bin"
          }

          extract_version 26.1 775
          extract_version 26.2 776

      - name: Commit generated binary snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/v775.bin data/registry/v776.bin
          git diff --cached --stat
          git commit -m "fix(limbo): bundle registry data for Minecraft 26.1 and 26.2"
          git push origin HEAD:fix/limbo-auth-modern
